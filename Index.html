<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQFAM - Cinematic Car Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background-color: #050505;
            color: #fff;
        }
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(5, 5, 5, 0.85) 100%);
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            max-width: 900px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .logo {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.9), 0 0 50px rgba(236, 72, 153, 0.5);
            animation: pulseGlow 3s infinite alternate;
        }
        .tagline {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 50px;
            color: #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .interactive-zone {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .cta-button {
            display: inline-flex;
            align-items: center;
            padding: 22px 50px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
        }
        .cta-button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.9), 0 0 20px rgba(236, 72, 153, 0.8);
        }
        .tool-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .tool-btn {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid #4a5568;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .tool-btn:hover {
            border-color: #a855f7;
            color: #fff;
            background: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        @keyframes pulseGlow {
            from { text-shadow: 0 0 20px rgba(168, 85, 247, 0.8); }
            to { text-shadow: 0 0 40px rgba(168, 85, 247, 1), 0 0 20px rgba(236, 72, 153, 0.8); }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=2000&auto=format&fit=crop" alt="Cinematic Car in Space" class="hero-bg" id="heroImage">
        <div class="hero-overlay"></div>
        
        <div class="content">
            <h1 class="logo">TORQFAM</h1>
            <p class="tagline">Customise • Edit • Create</p>
            
            <div class="interactive-zone">
                <a href="#editor" class="cta-button">EDIT YOUR CAR</a>
                
                <div class="tool-controls">
                    <button class="tool-btn" onclick="applyEffect('zoom')">Zoom Mode</button>
                    <button class="tool-btn" onclick="applyEffect('spin')">Spin Rim</button>
                    <button class="tool-btn" onclick="applyEffect('blur')">Motion Blur</button>
                    <button class="tool-btn" onclick="applyEffect('reset')">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div id="editor" style="padding: 100px 20px; text-align: center; background: #050505;">
        <h2>Editor Section Coming Soon</h2>
        <p>Interactive tools will be connected here.</p>
    </div>

    <script>
        const hero = document.getElementById('heroImage');
        
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 40;
            hero.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
        });

        document.addEventListener('mouseleave', () => {
            hero.style.transform = 'translate(0px, 0px) scale(1)';
        });

        function applyEffect(effect) {
            hero.style.transition = 'all 0.5s ease';
            if (effect === 'zoom') {
                hero.style.transform = 'scale(1.2)';
            } else if (effect === 'spin') {
                hero.style.transform = 'scale(1.05) rotate(5deg)';
            } else if (effect === 'blur') {
                hero.style.filter = 'blur(5px)';
            } else if (effect === 'reset') {
                hero.style.transform = 'scale(1)';
                hero.style.filter = 'blur(0px)';
            }
        }
    </script>
</body>
</html>
