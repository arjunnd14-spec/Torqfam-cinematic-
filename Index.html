<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQFAM - Cinematic Car Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background-color: #050505;
            color: #fff;
        }
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(5,5,5,0.8) 100%);
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 3;
            max-width: 800px;
            padding: 20px;
        }
        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
        }
        .tagline {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: #a855f7;
        }
        .cta-button {
            display: inline-block;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.9);
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Replace the URL below with the direct link to your uploaded galaxy/car image -->
        <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=2000&auto=format&fit=crop" alt="Cinematic Car in Space" class="hero-bg">
        <div class="hero-overlay"></div>
        
        <div class="content">
            <h1 class="logo">TORQFAM</h1>
            <p class="tagline">Customise • Edit • Create</p>
            <a href="#editor" class="cta-button">EDIT YOUR CAR</a>
        </div>
    </div>

    <!-- Editor Section placeholder -->
    <div id="editor" style="padding: 100px 20px; text-align: center;">
        <h2>Editor Section Coming Soon</h2>
        <p>Interactive tools will be connected here.</p>
    </div>

</body>
</html>
